# Yerel geliştirme ortamı: PostgreSQL + Garage (S3 uyumlu depolama).
# Buradaki şifre ve token'lar YALNIZCA yerel geliştirme içindir; production değerleri ayrı tutulur.
name: japar-akademi

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - "5433:5432" # makinede 5432 kullanılıyorsa çakışmasın
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d akademi"]
      interval: 5s
      timeout: 3s
      retries: 20

  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: 3f6e2d1c0b9a8f7e6d5c4b3a2918f7e6d5c4b3a291807f6e5d4c3b2a19087f6e
      GARAGE_ADMIN_TOKEN: dev-garage-admin-token
      GARAGE_METRICS_TOKEN: dev-garage-metrics-token
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin API
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

volumes:
  pgdata:
  garage-meta:
  garage-data:
