name: CI

# Testler PR'da bir kez çalışır; main'e birleştirince yalnızca imajlar derlenip gönderilir (aynı kod iki kez
# test edilmez). Güvenlik ağı: her gece main'de bütün testler; elle de başlatılabilir (Actions → CI → Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  # Olay türü de grupta: gece testi main'e gönderilen imaj işini (ya da tersini) iptal etmesin
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tip, test, build, e2e
    # main'e push'ta çalışmaz: kod PR'da test edildi (dal güncel olmadan merge edilemez — branch protection)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      # Yalnızca ffmpeg ve zorunlu bağımlılıkları (önerilen paketler — grafik sürücüleri, ses verileri — kurulmaz).
      # Kurulum takılırsa CI'ı durdurmaz: ffmpeg yoksa video testi atlanır.
      - name: ffmpeg (video HLS testleri)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300 ffmpeg
          ffmpeg -version | head -1

      - name: Ortam dosyası (.env.example + CI gizli değerleri)
        run: |
          cp .env.example .env
          sed -i "s#^BETTER_AUTH_SECRET=.*#BETTER_AUTH_SECRET=$(openssl rand -base64 32)#" .env
          sed -i "s#^SEED_ADMIN_PASSWORD=.*#SEED_ADMIN_PASSWORD=Ci.Admin-$(openssl rand -hex 6)#" .env
          sed -i "s#^NATIONAL_ID_ENC_KEYS=.*#NATIONAL_ID_ENC_KEYS=1:$(openssl rand -base64 32)#" .env
          sed -i "s#^NATIONAL_ID_HMAC_KEY=.*#NATIONAL_ID_HMAC_KEY=$(openssl rand -base64 32)#" .env

      - name: PostgreSQL + Garage
        run: docker compose -f docker/compose.yml up -d --wait

      - name: Depolama ve veritabanı kurulumu
        run: |
          npm run storage:init
          npm run db:migrate

      - name: Bağımlılık güvenlik taraması (yüksek/kritik; incelenmiş istisnalar audit-allowlist.json)
        run: node scripts/audit-check.mjs

      - name: Lint
        run: npm run lint

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Birim testleri
        run: npm test

      - name: Entegrasyon testleri
        run: npm run test:integration

      - name: Migration'lar şemayla uyumlu mu
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Şema değişmiş ama migration üretilmemiş (npm run db:generate)"
            git status --porcelain drizzle
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Worker derlemesi
        run: npm run worker:build

      # ffmpeg adımı süre sınırına takılırsa arka planda kalan apt-get dpkg kilidini tutabilir;
      # Playwright'ın sistem paketlerini kurmadan önce kilit boşalana kadar beklenir (en çok 10 dk).
      - name: Playwright tarayıcısı
        run: |
          timeout 600 bash -c 'while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1; do echo "apt kilidi bekleniyor..."; sleep 5; done' || echo "apt kilidi 10 dk içinde boşalmadı; kurulum yine de deneniyor"
          npx playwright install --with-deps chromium

      - name: Uçtan uca testler
        run: npm run test:e2e

      - name: Playwright raporu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Üretim imajları (karar #102): PR'da testlerle aynı anda derlenir (gönderilmez); main'e birleştirince derlenip
  # GitHub Container Registry'ye gönderilir. İmajlarda yalnızca kod vardır; kişisel veri kurumun sunucusunda kalır.
  images:
    name: Docker imajları
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: İmaj adları
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/$owner/japar-akademi-app" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/$owner/japar-akademi-worker" >> "$GITHUB_OUTPUT"
          echo "push=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR girişi
        if: steps.names.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: app imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: app
          push: ${{ steps.names.outputs.push == 'true' }}
          tags: ${{ steps.names.outputs.app }}:latest,${{ steps.names.outputs.app }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: worker imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: worker
          push: ${{ steps.names.outputs.push == 'true' }}
          tags: ${{ steps.names.outputs.worker }}:latest,${{ steps.names.outputs.worker }}:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
